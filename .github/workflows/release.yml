name: Release ExtBay package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.extbay
            release/*.extbay.sha256
